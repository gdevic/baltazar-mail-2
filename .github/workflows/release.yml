# Publishes a GitHub release whose assets are ZIPs of the two extensions, Baltazar Mail for
# Yahoo and Baltazar Mail for Gmail: unzip one anywhere and load the folder inside with "Load
# unpacked".
# Runs when a v* tag is pushed, or from the Actions tab (Run workflow) with a tag name, which then
# tags the selected branch.
# The tag must match the version in VERSION, e.g. v0.13.4. A manual run must start from
# main, and a tag that already exists must point at the commit being built. Those checks come
# first; nothing is published unless every test suite passes after them (tests.yml).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.13.4 (must match VERSION)"
        required: true

permissions:
  contents: write
  id-token: write        # signs the build provenance
  attestations: write

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # with tags, to see whether the release tag already exists

      # Values from the tag reach the shell only through environment variables, never by
      # expansion into the script text, and the tag must look like a version.
      - name: Check version, branch and tag
        id: ver
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: tools/release-check.sh

  tests:
    needs: check
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    needs: [check, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check bundled libraries
        run: node tools/vendor-check.mjs --upstream --osv

      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # tools/build.js lays each edition's folder (yahoo/, gmail/) over ext/ into
          # dist/baltazar-mail-<edition>. The folder inside the install ZIP keeps that name in every
          # release: the browser ties an unpacked extension (and its settings and address book) to
          # its folder path, so updates unzip over the same folder.
          for edition in yahoo gmail; do
            name="baltazar-mail-$edition"
            node tools/build.js "$edition"
            find "dist/$name" -name '.DS_Store' -delete
            cp LICENSE "dist/$name/LICENSE"
            zipname="$name-$VERSION.zip"
            (cd dist && zip -qr9 "$zipname" "$name")
            unzip -l "dist/$zipname" | grep -q " $name/manifest.json$"
            (cd dist && sha256sum "$zipname" > "$zipname.sha256")
            # The store package is built again without a manifest key, since a store assigns the
            # extension id itself and refuses a manifest that carries one, and with manifest.json
            # at the top level, as browser stores require.
            node tools/build.js "$edition" --store
            find "dist/$name" -name '.DS_Store' -delete
            cp LICENSE "dist/$name/LICENSE"
            if grep -q '"key"' "dist/$name/manifest.json"; then echo "the $edition store manifest carries a key"; exit 1; fi
            storename="$name-$VERSION-store.zip"
            (cd "dist/$name" && zip -qr9 "../$storename" .)
            unzip -l "dist/$storename" | grep -q " manifest.json$"
            (cd dist && sha256sum "$storename" > "$storename.sha256")
          done

      - name: Record build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/baltazar-mail-yahoo-${{ needs.check.outputs.version }}.zip
            dist/baltazar-mail-yahoo-${{ needs.check.outputs.version }}-store.zip
            dist/baltazar-mail-gmail-${{ needs.check.outputs.version }}.zip
            dist/baltazar-mail-gmail-${{ needs.check.outputs.version }}-store.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          tag="$TAG"
          version="$VERSION"
          cat > notes.md <<NOTES
          ### Install
          Two extensions: **baltazar-mail-yahoo-$version.zip** for Yahoo Mail and **baltazar-mail-gmail-$version.zip** for Gmail. Both can be installed side by side.
          1. Download the ZIP and unzip it into a folder you will keep, such as Documents; it contains one folder, \`baltazar-mail-yahoo\` or \`baltazar-mail-gmail\`.
          2. Open \`edge://extensions\` (or \`chrome://extensions\`) and turn on **Developer mode**.
          3. Click **Load unpacked** and select that folder.
          4. Yahoo: be signed in to mail.yahoo.com in the same browser profile, then click the Baltazar Mail for Yahoo toolbar icon. Gmail: click the Baltazar Mail for Gmail toolbar icon and sign in with Google when asked (see docs/google-setup.md for the OAuth client an unpacked copy needs).

          ### Verify (optional)
          The ZIPs were built by GitHub Actions from the tagged commit, and GitHub signed a record of that. With the GitHub CLI: \`gh attestation verify baltazar-mail-yahoo-$version.zip -R $REPO\` (or \`baltazar-mail-gmail-$version.zip\`)

          The \`-store.zip\` assets hold the same files with \`manifest.json\` at the top level, as uploaded to browser stores; to install by hand, use the other ZIPs.

          ### Update
          Unzip the new release over the same folder, replacing the files, then click **Reload** on the extension's card in the extensions page. Do not remove the extension to update it: removing deletes its settings and address book.

          NOTES
          gh release create "$tag" dist/*.zip dist/*.zip.sha256 \
            --title "Baltazar Mail $version" --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
