# All test suites: the unit tests and the bundled-library hashes, then the built Yahoo extension in
# Playwright's Chromium against a mocked Yahoo (smoke.js, yahoo-runtime.js) and the built Gmail
# extension against a mocked Gmail (gmail-runtime.js). Each suite builds what it tests. Runs on
# every push to main and every pull request, before every release, and from the Actions tab.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tests import ext/*.js and the built adapters as ES modules without a package.json,
      # which needs Node's module-syntax detection (Node 22.7 and later).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: |
          node --version
          for t in tools/*-test.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done

      - name: Bundled libraries match their recorded hashes
        run: node tools/vendor-check.mjs

      # The version every test has been run with; not saved to the repository.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Smoke test
        run: node tools/smoke.js

      - name: Yahoo runtime test (the built Yahoo extension)
        run: node tools/yahoo-runtime.js

      - name: Gmail runtime test (the built Gmail extension)
        run: node tools/gmail-runtime.js
