<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c060"/><stop offset="1" stop-color="#c98f2c"/>
    </linearGradient>
    <!-- keeps the flap's line ends inside the envelope, where no dark background hides them -->
    <clipPath id="body"><rect x="24" y="35" width="80" height="60" rx="8"/></clipPath>
  </defs>
  <!-- no background, unlike the Yahoo edition's icon, so the two tell apart in the toolbar; the
       envelope fills the canvas edge to edge, taller and with shorter dashes, to look as large as
       an icon with a background -->
  <g transform="matrix(1.34 0 0 1.34 -12.4 -23.1)">
    <!-- envelope body -->
    <rect x="24" y="35" width="80" height="60" rx="8" fill="url(#gold)"/>
    <!-- flap -->
    <path d="M24 43 L64 72 L104 43" clip-path="url(#body)" fill="none" stroke="#15181c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- bottom fold lines -->
    <path d="M30 91 L52 69 M98 91 L76 69" fill="none" stroke="#15181c" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <!-- speed dash -->
    <path d="M15 59 h5 M12 73 h8 M15 86 h5" stroke="#f0c060" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
